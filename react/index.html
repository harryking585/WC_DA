<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WC_DA – Mythic+ Best Runs</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>WC_DA</h1>
      <p class="subtitle">
        World of Warcraft Mythic+ Best Run Analyzer
      </p>
    </header>

    <section class="card">
      <form id="apiForm">
        <div class="form-group">
          <label for="realm">Realm</label>
          <input type="text" id="realm" placeholder="ex: dalaran" required />
        </div>

        <div class="form-group">
          <label for="name">Character Name</label>
          <input type="text" id="name" placeholder="ex: Drchocolate" required />
        </div>

        <button type="submit">Fetch Best Runs</button>
      </form>
    </section>

    <div id="response" class="response"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
